# ========================================================
# 1. Redirection HTTP (Port 80) vers HTTPS (Port 443)
# ========================================================
server {
    listen 80;
    server_name lifechannelmedia.com www.lifechannelmedia.com 62.169.27.157 localhost;

    # Défi ACME Let's Encrypt pour les renouvellements automatiques
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection automatique vers HTTPS pour tout le reste
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================================
# 2. Serveur Sécurisé HTTPS (Port 443) avec SSL Let's Encrypt
# ========================================================
server {
    listen 443 ssl;
    server_name lifechannelmedia.com www.lifechannelmedia.com;

    # Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/lifechannelmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifechannelmedia.com/privkey.pem;

    # Protocoles et suites de chiffrement sécurisées
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Compression GZIP pour optimiser la bande passante (RDC & Mobile)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Routage React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE Notifications Stream (pas de buffering, timeout prolongé pour flux direct)
    location /api/notifications/stream {
        proxy_pass http://api-gateway:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Proxy vers l'API Gateway Spring Cloud
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Cache des fichiers statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
