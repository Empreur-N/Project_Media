server:
  port: 8083

spring:
  application:
    name: media-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/media_db
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

upload:
  dir: ../uploads
