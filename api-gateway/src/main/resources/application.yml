server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/contents/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/medias/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/comments/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
        - id: podcast-service
          uri: lb://podcast-service
          predicates:
            - Path=/api/podcasts/**
        - id: live-service
          uri: lb://live-service
          predicates:
            - Path=/api/lives/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
        - id: advertisement-service
          uri: lb://advertisement-service
          predicates:
            - Path=/api/ads/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
