server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: podcast-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/podcast_db}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
